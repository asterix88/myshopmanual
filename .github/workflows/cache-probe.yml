name: Cache probe
on:
  push:
    branches: [diag/cache-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warm with upload_r2.py
        run: |
          mkdir dist
          curl -s -A MyManual-probe https://mymanual.my.id/catalog.json -o dist/catalog.json
          python3 tools/upload_r2.py dist --warm-all > cache-out.txt 2>&1 || true
          cat cache-out.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add cache-out.txt && git commit -m "warm probe output" && git push
