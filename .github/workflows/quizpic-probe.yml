name: Quiz picture probe
on:
  push:
    branches: [diag/quizpic]
    paths: [tools/diag/quizpic_probe.py, .github/workflows/quizpic-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pypdfium2 pillow
      - run: |
          npx -y wrangler@4 r2 object get mymanual/catalog.json --file /tmp/catalog.json --remote
          KEY=$(python3 -c "import json;c=json.load(open('/tmp/catalog.json'));print(next(f['pdf']['path'] for u in c['units'] for f in u['files'] if f['title'].upper().startswith('PM PC1250')))")
          echo "key $KEY"
          npx -y wrangler@4 r2 object get "mymanual/$KEY" --file /tmp/so.pdf --remote
      - run: python3 tools/diag/quizpic_probe.py 158 > tools/diag/quizpic.txt 2>&1 || true
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add tools/diag && git commit -m "probe output" && git push
