name: Deploy AI server

# Publishes ai-worker/ to Cloudflare (ai.mymanual.my.id) whenever it changes
# on main, so nothing has to be installed or run on a PC, and copies the
# manuals' text into the AI's search database (D1). The copy also runs every
# 3 hours, so manuals uploaded with update.bat become searchable on their own;
# run this workflow by hand to pick them up at once.
# Needs repository secrets CLOUDFLARE_API_TOKEN (with D1 Edit permission),
# CLOUDFLARE_ACCOUNT_ID and GROQ_API_KEY.
on:
  push:
    branches: [main]
    paths: ['ai-worker/**', 'tools/sync_search.py', '.github/workflows/ai-worker.yml']
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  group: ai-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping the AI server deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.check.outputs.ready == 'true'
        working-directory: ai-worker
      - run: npx tsc --noEmit
        if: steps.check.outputs.ready == 'true'
        working-directory: ai-worker
      - name: Find or create the search database
        if: steps.check.outputs.ready == 'true'
        working-directory: ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name == "mymanual-search") | .uuid'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create mymanual-search --location apac --update-config=false
            id=$(find_id)
          fi
          echo "D1 database: $id"
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Copy the manuals' text into the search database
        if: steps.check.outputs.ready == 'true'
        working-directory: ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERVER: ${{ vars.CATALOG_URL }}
        run: python3 ../tools/sync_search.py --server "${SERVER:-https://mymanual.my.id}"
      - uses: cloudflare/wrangler-action@v3
        # The scheduled run only copies new manuals; code changes deploy on push.
        if: steps.check.outputs.ready == 'true' && github.event_name != 'schedule'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ai-worker
          wranglerVersion: '4.147.0'
          secrets: |
            GROQ_API_KEY
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
