name: Deploy AI server

# Publishes ai-worker/ to Cloudflare (ai.mymanual.my.id) whenever it changes
# on main, so nothing has to be installed or run on a PC.
# Needs repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
# GROQ_API_KEY; DEEPSEEK_API_KEY is optional (without it DeepSeek is skipped),
# and so is TAVILY_API_KEY (web search; without it the AI searches
# Wikipedia). OWNER_CODE (the admin code) is needed to upload the employee
# list from update.bat. The API token needs Workers Scripts, Workers KV
# Storage and Workers R2 Storage (all Edit) plus Workers Routes on the zone.
on:
  push:
    branches: [main]
    paths: ['ai-worker/**', '.github/workflows/ai-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEEPSEEK: ${{ secrets.DEEPSEEK_API_KEY }}
          OWNER: ${{ secrets.OWNER_CODE }}
          TAVILY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK" ]; then echo "deepseek=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$OWNER" ]; then echo "owner=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$TAVILY" ]; then echo "tavily=true" >> "$GITHUB_OUTPUT"; fi
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping the AI server deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.check.outputs.ready == 'true'
        working-directory: ai-worker
      - run: npx tsc --noEmit
        if: steps.check.outputs.ready == 'true'
        working-directory: ai-worker
      # The employee list lives in a KV namespace; made on the first deploy.
      - name: Set up the login storage
        if: steps.check.outputs.ready == 'true'
        working-directory: ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() {
            npx wrangler kv namespace list | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const list = JSON.parse(s.slice(s.indexOf("[")));
                const ns = list.find(n => n.title === "mymanual-auth" || n.title.endsWith("-mymanual-auth"));
                if (ns) console.log(ns.id);
              });'
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create mymanual-auth
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then
            echo "::error::Could not find or create the KV namespace mymanual-auth. The Cloudflare API token needs 'Workers KV Storage: Edit'."
            exit 1
          fi
          sed -i "s/AUTH_KV_ID/$ID/" wrangler.toml
          echo "KV namespace mymanual-auth: $ID"
      - uses: cloudflare/wrangler-action@v3
        if: steps.check.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ai-worker
          wranglerVersion: '4.147.0'
          secrets: |
            GROQ_API_KEY
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Upload the DeepSeek key
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.deepseek == 'true'
        working-directory: ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: printf '%s' "$DEEPSEEK_API_KEY" | npx wrangler secret put DEEPSEEK_API_KEY
      - name: Upload the admin code
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.owner == 'true'
        working-directory: ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_CODE: ${{ secrets.OWNER_CODE }}
        run: printf '%s' "$OWNER_CODE" | npx wrangler secret put OWNER_CODE
      - name: Upload the web search key
        if: steps.check.outputs.ready == 'true' && steps.check.outputs.tavily == 'true'
        working-directory: ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: printf '%s' "$TAVILY_API_KEY" | npx wrangler secret put TAVILY_API_KEY
