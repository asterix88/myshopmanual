name: AI probe
on:
  push:
    branches: [diag/ai-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/zz_live_ai_test.dart --reporter expanded
