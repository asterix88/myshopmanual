name: AI probe
on:
  push:
    branches: [diag/ai-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Start the AI server locally
        working-directory: ai-worker
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          npm ci
          printf 'GROQ_API_KEY=%s\nDEEPSEEK_API_KEY=%s\n' "$GROQ_API_KEY" "$DEEPSEEK_API_KEY" > .dev.vars
          nohup npx wrangler dev --local --port 8787 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:8787/ && break; sleep 2; done
      - name: Live test
        working-directory: app
        run: |
          flutter pub get
          flutter test test/zz_live_ai_test.dart || true
          PDFIUM=$(find "$PWD" -name libpdfium.so | head -1); echo "pdfium: $PDFIUM"
          PDFIUM=$PDFIUM flutter test test/zz_live_ai_test.dart --reporter expanded
      - if: always()
        run: grep -i "model failed\|error" /tmp/wrangler.log | head -40 || true
