name: AI probe
on:
  push:
    branches: [diag/ai-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -x
          curl -sS -m 30 -i https://ai.mymanual.my.id/ || true
          echo
          curl -sS -m 120 -i -X POST https://ai.mymanual.my.id/chat \
            -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"Berapa tekanan relief swing motor PC210?"}],"manuals":["PC210-10MO: Shop Manual PC210 (Shop Manual)"]}' || true
