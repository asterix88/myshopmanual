name: AI probe
on:
  push:
    branches: [diag/ai-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "deepseek key set: $([ -n "$DEEPSEEK_API_KEY" ] && echo yes || echo no)"
          python3 - <<'PY'
          import base64, json, os, urllib.request, time
          img = base64.b64encode(open('.github/probe/probe.jpg','rb').read()).decode()
          tool = {"type":"function","function":{"name":"search_manuals","description":"Search manuals","parameters":{"type":"object","properties":{"query":{"type":"string"},"unit":{"type":"string"}},"required":["query","unit"]}}}
          def call(url, key, body):
              req = urllib.request.Request(url, json.dumps(body).encode(), {"content-type":"application/json","authorization":"Bearer "+key,"user-agent":"curl/8"})
              t=time.time()
              try:
                  r = urllib.request.urlopen(req, timeout=90); out = r.read().decode(); code = r.status
              except urllib.error.HTTPError as e:
                  out = e.read().decode(); code = e.code
              print("  ->", code, round(time.time()-t,1), "s"); print("  ", out[:900])
          q="Kabel apa yang menghubungkan pump controller ke CN-E12, dan fuse berapa? Jawab singkat."
          vis=[{"type":"text","text":q},{"type":"image_url","image_url":{"url":"data:image/jpeg;base64,"+img}}]
          print("GROQ qwen vision")
          call("https://api.groq.com/openai/v1/chat/completions", os.environ["GROQ_API_KEY"], {"model":"qwen/qwen3.8-27b","max_tokens":600,"tools":[tool],"tool_choice":"auto","messages":[{"role":"user","content":vis}]})
          print("DEEPSEEK vision")
          call("https://api.deepseek.com/chat/completions", os.environ["DEEPSEEK_API_KEY"], {"model":"deepseek-v4-flash","max_tokens":300,"thinking":{"type":"disabled"},"messages":[{"role":"user","content":vis}]})
          req=urllib.request.Request("https://api.deepseek.com/models",headers={"authorization":"Bearer "+os.environ["DEEPSEEK_API_KEY"],"user-agent":"curl/8"})
          print("DEEPSEEK MODELS", urllib.request.urlopen(req).read().decode()[:600])
          PY
