name: AI probe
on:
  push:
    branches: [diag/ai-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "deepseek key set: $([ -n "$DEEPSEEK_API_KEY" ] && echo yes || echo no)"
          python3 - <<'PY'
          import base64, json, os, urllib.request, time
          img = base64.b64encode(open('.github/probe/probe.jpg','rb').read()).decode()
          tool = {"type":"function","function":{"name":"search_manuals","description":"Search manuals","parameters":{"type":"object","properties":{"query":{"type":"string"},"unit":{"type":"string"}},"required":["query","unit"]}}}
          def call(url, key, body):
              req = urllib.request.Request(url, json.dumps(body).encode(), {"content-type":"application/json","authorization":"Bearer "+key,"user-agent":"curl/8"})
              t=time.time()
              try:
                  r = urllib.request.urlopen(req, timeout=90); out = r.read().decode(); code = r.status
              except urllib.error.HTTPError as e:
                  out = e.read().decode(); code = e.code
              print("  ->", code, round(time.time()-t,1), "s"); print("  ", out[:900])
          view={"type":"function","function":{"name":"view_page","description":"Look at a manual page as a picture","parameters":{"type":"object","properties":{"manual":{"type":"string"},"page":{"type":"integer"}},"required":["manual","page"]}}}
          msgs=[{"role":"system","content":"Answer in Bahasa Indonesia. Manuals: [M1] PC210: Electrical diagram (picture only, 1 page). Use view_page to look at picture-only manuals."},
                {"role":"user","content":"Kabel apa yang menghubungkan pump controller ke CN-E12, dan fuse berapa?"},
                {"role":"assistant","content":"","tool_calls":[{"id":"c1","type":"function","function":{"name":"view_page","arguments":"{\"manual\":\"M1\",\"page\":1}"}}]},
                {"role":"tool","tool_call_id":"c1","content":"The picture of [S1] PC210 · Electrical diagram · page 1 is attached in the next message."},
                {"role":"user","content":[{"type":"text","text":"[S1] page picture:"},{"type":"image_url","image_url":{"url":"data:image/jpeg;base64,"+img}}]}]
          for name,url,key,model,extra in [("deepseek","https://api.deepseek.com/chat/completions",os.environ["DEEPSEEK_API_KEY"],"deepseek-v4-flash",{"thinking":{"type":"disabled"}}),("qwen","https://api.groq.com/openai/v1/chat/completions",os.environ["GROQ_API_KEY"],"qwen/qwen3.8-27b",{})]:
              print("TOOL+IMAGE", name)
              call(url,key,{"model":model,"max_tokens":500,"tools":[tool,view],"tool_choice":"auto","messages":msgs,**extra})
          PY
