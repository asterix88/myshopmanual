name: AI probe
on:
  push:
    branches: [diag/ai-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ua in "curl/8" "Dart/3.9 (dart:io)" "Python-urllib/3.12"; do
            curl -sS -m 60 -A "$ua" -o /dev/null -w "$ua -> %{http_code} %{size_download} bytes %{time_total}s\n" https://mymanual.my.id/units/PC210-1OMO/OMM_PC210.sqlite
          done
          curl -sS -m 60 -A "Dart/3.9 (dart:io)" -H 'Range: bytes=0-99' -o /dev/null -w "range -> %{http_code} %{size_download}\n" https://mymanual.my.id/units/PC210-1OMO/OMM_PC210.sqlite
