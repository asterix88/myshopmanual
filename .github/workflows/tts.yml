name: TTS voice-over (diag)
on:
  push:
    branches: [diag/tts]
    paths: [tts/lines.txt, tts/eleven.py, tts/voice.txt, tts/music.txt, tts/run.txt, tts/takes.txt, .github/workflows/tts.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ElevenLabs voice-over
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          export ELEVEN_VOICE="$(cat tts/voice.txt 2>/dev/null || true)"
          python tts/eleven.py 2>&1 | tee tts/eleven-log.txt
      - name: Commit output
        if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -A tts && (git commit -m "tts output" && git push || true)
