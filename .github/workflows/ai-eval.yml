name: nyel AI test

# Asks nyel AI the questions it once got wrong (app/tool/ai_eval.json), on a
# local copy of the AI server with the real manuals and keys, whenever the
# AI's instructions or the app's chat code change. Add a question there when
# a "Jawaban salah" report shows a new mistake.
on:
  pull_request:
    paths:
      - "ai-worker/src/**"
      - "app/lib/src/ai.dart"
      - "app/tool/ai_eval*"
      - ".github/workflows/ai-eval.yml"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Start the AI server locally
        working-directory: ai-worker
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          npm ci
          printf 'GROQ_API_KEY=%s\nDEEPSEEK_API_KEY=%s\nTAVILY_API_KEY=%s\n' "$GROQ_API_KEY" "$DEEPSEEK_API_KEY" "$TAVILY_API_KEY" > .dev.vars
          nohup npx wrangler dev --local --port 8787 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:8787/ && break; sleep 2; done

      - name: Ask the questions
        working-directory: app
        env:
          OWNER_CODE: ${{ secrets.OWNER_CODE }}
        run: |
          flutter pub get
          flutter test tool/ai_eval_test.dart --reporter expanded

      - name: AI server log
        if: failure()
        run: tail -n 200 /tmp/wrangler.log
