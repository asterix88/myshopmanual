name: Backup mingguan

# Copies the employee list (Cloudflare KV "emp:*") and the whole quiz
# database (Cloudflare D1 mymanual-quiz) every Sunday at 22.00 WIB, and
# keeps them as a ZIP on the run's page for 90 days. How to read and restore
# a backup: BACKUP.md. Uses the secrets of the AI server deploy
# (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID); nothing else to set up.
# Cetok Online (Supabase) is not here: it has its own backup (Telegram bot).
on:
  schedule:
    - cron: '0 15 * * 0' # Sunday 15.00 UTC = 22.00 WIB
  workflow_dispatch: # Actions > Backup mingguan > Run workflow
  workflow_call: # "Pulihkan backup" saves the current data first
    inputs:
      prefix:
        type: string
        default: backup
    outputs:
      name:
        value: ${{ jobs.backup.outputs.name }}

jobs:
  backup:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.name.outputs.name }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: ai-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl

      # backup-2026-11-23, or sebelum-pulih-2026-11-26-1405 before a restore.
      - name: Name
        id: name
        env:
          PREFIX: ${{ inputs.prefix || 'backup' }}
        run: |
          if [ "$PREFIX" = backup ]; then
            echo "name=backup-$(TZ=Asia/Jakarta date +%F)" >> "$GITHUB_OUTPUT"
          else
            echo "name=$PREFIX-$(TZ=Asia/Jakarta date +%F-%H%M)" >> "$GITHUB_OUTPUT"
          fi

      - name: Karyawan
        run: python tools/backup_tool.py export-karyawan out/pulihkan/karyawan.json

      # Cloudflare's own copy: every quiz table with its rows, as SQL.
      - name: Quiz
        working-directory: ai-worker
        run: npx wrangler d1 export mymanual-quiz --remote --output ../out/pulihkan/quiz.sql

      - name: Excel files
        run: |
          python tools/backup_tool.py excel-karyawan out/pulihkan/karyawan.json out/karyawan.xlsx
          python tools/backup_tool.py excel-quiz out/pulihkan/quiz.sql out/quiz.xlsx
          cp BACKUP.md out/BACA-SAYA.md

      - name: Summary
        run: |
          {
            echo "### ${{ steps.name.outputs.name }}"
            echo
            echo "- Karyawan: $(python -c 'import json;print(len(json.load(open("out/pulihkan/karyawan.json"))["items"]))')"
            echo "- Quiz: $(python tools/backup_tool.py count-quiz out/pulihkan/quiz.sql)"
            echo
            echo "Unduh di bagian **Artifacts** di bawah. Cara memulihkan: BACKUP.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: out/
          retention-days: 90
          if-no-files-found: error
