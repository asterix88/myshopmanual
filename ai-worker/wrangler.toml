# Cloudflare Worker behind the app: nyel AI (holds the AI keys so they never
# ship inside the APK), the employee login (NRP + PIN) and, on
# files.mymanual.my.id, the manuals for logged-in phones. GitHub Actions
# deploys it (.github/workflows/ai-worker.yml) whenever this folder changes
# on main.
name = "mymanual-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Served on its own subdomain: workers.dev, like r2.dev, may be blocked by
# mobile operators.
routes = [
  { pattern = "ai.mymanual.my.id", custom_domain = true },
  { pattern = "files.mymanual.my.id", custom_domain = true },
]

# The manuals, read by files.mymanual.my.id (src/files.ts).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mymanual"

# Employees, sessions' signing key and nyel AI's daily counts (src/auth.ts).
# The deploy workflow creates the namespace "mymanual-auth" on first run and
# puts its id here.
[[kv_namespaces]]
binding = "AUTH"
id = "AUTH_KV_ID"

# Usage statistics for admins (src/stats.ts): one Durable Object with its
# own SQLite database, made on the first deploy.
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "stats-v1"
new_sqlite_classes = ["Stats"]

[vars]
# Any OpenAI-compatible chat API with tool calling works. MODEL is a list
# tried in order: when one model is busy, out of credit or retired, the next
# one answers. "deepseek:<model>" goes to DeepSeek (paid, cheap); a bare name
# goes to API_URL (Groq's free tier, each model with its own per-minute
# limit). Entries whose API key secret is not set are skipped.
API_URL = "https://api.groq.com/openai/v1/chat/completions"
MODEL = "deepseek:deepseek-v4-flash,openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b"
# Used instead of MODEL once the AI has looked at a page picture: only these
# models can see pictures.
VISION_MODEL = "deepseek:deepseek-v4-flash,qwen/qwen3.8-27b"
# "1": nyel AI refuses phones that are not logged in (app versions from
# before the NRP login). Set by Anas on 29 Oct 2026 with sections, since a
# section's manuals must only reach its NRPs.
REQUIRE_LOGIN = "1"

# Secrets, never in this file:
#   DEEPSEEK_API_KEY  key from platform.deepseek.com, uploaded by the workflow
#                     from the GitHub secret of the same name
#   GROQ_API_KEY      key from console.groq.com, uploaded the same way
#   TAVILY_API_KEY    optional; key from app.tavily.com for the AI's web search
#                     (free plan, 1,000 searches a month); without it, or when
#                     those run out, the AI searches Wikipedia
#   OWNER_CODE        the admin code; update.bat sends it (ADMIN_CODE in
#                     r2-keys.bat) to upload karyawan.xlsx and warm manuals
#   APP_TOKEN         optional; when set (npx wrangler secret put APP_TOKEN), the
#                     app must send it, so also set the GitHub secret AI_TOKEN
