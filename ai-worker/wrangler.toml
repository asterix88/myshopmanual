# Cloudflare Worker behind the app's "Tanya AI" tab. It holds the Groq
# API key so the key never ships inside the APK, and searches the manuals
# itself so the phone downloads nothing to ask about them. GitHub Actions deploys it
# (.github/workflows/ai-worker.yml) whenever this folder changes on main.
name = "mymanual-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Served on its own subdomain: workers.dev, like r2.dev, may be blocked by
# mobile operators.
routes = [{ pattern = "ai.mymanual.my.id", custom_domain = true }]

[vars]
# Any OpenAI-compatible chat API with tool calling works; Groq's free tier
# is the default. MODEL is a list tried in order: each Groq model has its own
# free per-minute limit, so when one is full the next one answers. Edit it
# (console.groq.com/docs/models) when a model is retired.
API_URL = "https://api.groq.com/openai/v1/chat/completions"
MODEL = "openai/gpt-oss-120b,llama-3.3-70b-versatile,meta-llama/llama-4-scout-17b-16e-instruct,openai/gpt-oss-20b,llama-3.1-8b-instant"

# The manuals' page text that the AI searches. tools/sync_search.py fills
# it from the server's search indexes; the workflow creates the database on
# first run and writes its id here before deploying.
[[d1_databases]]
binding = "DB"
database_name = "mymanual-search"
database_id = "00000000-0000-0000-0000-000000000000"

# Secrets, never in this file:
#   GROQ_API_KEY  key from console.groq.com, uploaded by the workflow from
#                 the GitHub secret of the same name
#   APP_TOKEN     optional; when set (npx wrangler secret put APP_TOKEN), the
#                 app must send it, so also set the GitHub secret AI_TOKEN
